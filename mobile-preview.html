<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Mobile Preview | Danny Ng Portfolio</title>
    <style>
      :root {
        --preview-bg: #e6e1d7;
        --preview-ink: #272722;
        --preview-muted: #625f58;
        --preview-line: #bdb5a7;
        --preview-shell: #f7f5f0;
        --preview-shadow: rgba(39, 39, 34, 0.24);
        --device-width: 390px;
        --device-height: 844px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        align-items: center;
        background: var(--preview-bg);
        color: var(--preview-ink);
        display: flex;
        font-family: "Source Sans Pro", Helvetica, Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
      }

      .preview {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .preview-label {
        color: var(--preview-muted);
        font-size: 0.86rem;
        font-weight: 600;
        line-height: 1.3;
        margin: 0;
        max-width: min(var(--device-width), calc(100vw - 40px));
        text-align: center;
      }

      .device {
        background: #11110f;
        border: 1px solid rgba(39, 39, 34, 0.42);
        border-radius: 30px;
        box-shadow: 0 22px 60px var(--preview-shadow);
        padding: 12px;
      }

      .screen {
        background: var(--preview-shell);
        border-radius: 20px;
        height: var(--device-height);
        outline: 1px solid var(--preview-line);
        overflow: hidden;
        width: var(--device-width);
      }

      .screen iframe {
        border: 0;
        display: block;
        height: 100%;
        width: 100%;
      }

      @media (max-width: 470px) {
        body {
          align-items: flex-start;
          justify-content: flex-start;
          min-width: calc(var(--device-width) + 24px);
          padding: 12px;
        }

        .preview {
          justify-items: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview" aria-label="390 by 844 mobile preview">
      <p class="preview-label">Mobile preview: 390 x 844</p>
      <div class="device">
        <div class="screen">
          <iframe src="index.html" title="Danny Ng portfolio mobile preview" loading="eager"></iframe>
        </div>
      </div>
    </main>
  </body>
</html>
